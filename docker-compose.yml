# Local development: builds the production image, then mounts ./src over the
# installed package (PYTHONPATH entries precede site-packages) so
# `uvicorn --reload` picks up edits without a rebuild.
services:
  web:
    build: .
    command:
      ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app/src
    env_file:
      - path: .env
        required: false # copy .env.example -> .env to set APP_* values
    volumes:
      - ./src:/app/src:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
